name: Pixiewps CI

on:
  - push
  - pull_request

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [debug, release]
        build: [normal, openssl]

    steps:
    - uses: actions/checkout@v7
    - name: Configure problem matchers
      run: echo ::add-matcher::.github/workflows/problem-matcher.json
    - name: make
      run: |
        export PARAMS
        if [[ ${{ matrix.build }} == "openssl" ]]; then
          export PARAMS="$PARAMS OPENSSL=1"
        fi
        if [[ ${{ matrix.type }} == "debug" ]]; then
          export PARAMS="$PARAMS CFLAGS=-DDEBUG=1"
        fi
        make $PARAMS
    #- name: Test help (exits with code 3)
    #  run: ./pixiewps
    - name: Test Mode 1 (RT/MT/CL) with E-S1/E-S2 = 0
      run: ./pixiewps -e  -r  -s 905ff57d93e5c43c620d2665dd5957d5babaf1b73091727c549438081e133538 -z b02b075028e76e5ffa271b31928543cbc56aec73e227c3b980ec5bed88f01eec -a 7fde11b9691cde264a21a46feb3db8aaaad730090932b824439be09178e76f2c -n 00000000000000000000000000000000
    - name: Test Mode 1 (RT/MT/CL) with backward derivation of E-S1/E-S2
      run: ./pixiewps -e  -r  -s f2647f4fbe10999a008ebe5b1471f96bb47e3e32e8587ab86dd4fc1e5628fde4 -z 47106d601655c988de6642e0e4e09e44e06ace00405dacde511e3c45ef39d460 -a cdf35ca5579893f165aa4d85b86a9258004e4c71010e5b9ef02d27c117b89779 -n 7469956c8526be3e1e456c2dd643b7c7
    - name: Test Mode 2 (eCos simple)
      run: ./pixiewps -e  -r  -a 77bfe4d37b88567185a1169d57d8378a7f889fb912a51ec8ca8e2f74f208c3bd -s 954f5fd37b4ca008fa1a1cbe6432a3a591a5d9d7019aebb3084a2c7f7fd6ad82 -z ff5e9d895b066ac69f5d90e7c1702c828d4606afcd87a7f2182c487f72ee44de -n 9575c2d6b158ed78f250b094107affbd
    - name: Test Mode 3 (RTL819x) with E-S1/E-S2 = E-Nonce
      run: ./pixiewps -e  -r  -s cd0c4cb9ebaaaff93c5fa14502e0af2d333593312670720c07d592d824b20857 -z 44b8c041ef510103b4e6ddae2971df293c3651306666d116b2ed6c05fc772489 -a 360c19bdfdc0b8ccb0e7a646c5bf60a2b3d1cc99a012459c056cf81ecc15357d -n 4c51caa463fa77410a44ec6b6d27a474
    - name: Test Mode 3 (RTL819x) with time-derived E-S1/E-S2
      run: ./pixiewps -e  -r  -s 2fa02bfdbe2fc4010c6c655870cc8fabb651f930401c61bb23c28a04597f163f -z 2fa02bfdbe2fc4010c6c655870cc8fabb651f930401c61bb23c28a04597f163f -a 06c01b8d83a4b25ea741980e912f59f3687d22d277526f7f12774bdecdbb16e0 -n 6dda2c0103bb28624169dcac0b4d3d20 --start 01/1970 --end 02/1970
    - name: Test Mode 3 (RTL819x) with PSK
      run: ./pixiewps -b 00c0ca78b137 -n 2030c1b46c1594743e0b78e65dac2e61 -e  -m 889aa5b151727a6dc0bad76e99a9f01c -r  -7 0dd8fca1209db2c06462cd0f46626931ce4c35ffe2db5f0b2647cf749aa847f12cb81f3f7d66987578e4d624bbc7d81603054e8ce4b747fef55036e68d6f173b6bfa2f4c62860030ce0639eec68c305a7c42498de8b97503f6d7b666499982b25ef128b2b40c2b8bd6f45ead0244f934 --mode 3 -5 0dd8fca1209db2c06462cd0f46626931fe3237b0c0541cee7ff160e3c22c1efa187f101b8acaa0ceee90723ed1469c7afc7cf2b7533333c694447a4241a16f3a -s 285e61797f46be06962777278c541f8dbe00dbe2859a9b66e94ef893f096e33e -z 45755e432b1833dc6e0e7ea522ac0e7dff0af4524d570430ca2f50026645c9cf -v 3
